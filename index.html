<style>
/* =========================================================
   VARIÁVEIS E BASE
========================================================= */
:root {
    --bg-bomb: #1a1c20;
    --metal: #2c3035;
    --red: #ff3333;
    --green: #00ff66;
    --blue: #00ccff;
    --yellow: #ffcc00;
    --terminal-bg: #051005;
    --terminal-green: #33ff33;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }

.screen { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; position: relative; }
.screen.active { display: flex; }

/* =========================================================
   UI GERAL (LOBBY)
========================================================= */
.container { padding: 20px; display: flex; flex-direction: column; justify-content: center; height: 100%; }
h1 { font-family: 'Teko', sans-serif; font-size: 4rem; text-align: center; color: var(--red); text-transform: uppercase; line-height: 1; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
.subtitle { text-align: center; color: #aaa; margin-bottom: 30px; letter-spacing: 2px; }

input, select, button { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: none; font-size: 1.2rem; font-family: 'Teko', sans-serif; text-transform: uppercase; }
input, select { background: #222; color: #fff; border: 2px solid #444; }
button { background: var(--red); color: white; cursor: pointer; font-size: 1.5rem; transition: 0.2s; box-shadow: 0 5px 0 #990000; }
button:active { transform: translateY(5px); box-shadow: 0 0 0 #990000; }
.btn-secondary { background: #444; box-shadow: 0 5px 0 #222; margin-top: 20px; }

.room-display { font-family: 'Share Tech Mono', monospace; font-size: 3.5rem; text-align: center; color: var(--yellow); letter-spacing: 10px; margin: 20px 0; background: #111; padding: 20px; border-radius: 10px; border: 2px dashed #555; }

/* =========================================================
   TELA DO DESARMADOR (THEME BOMB)
========================================================= */
.theme-bomb { background: var(--bg-bomb); box-shadow: inset 0 0 50px rgba(0,0,0,0.9); }
.bomb-header { display: flex; justify-content: space-between; padding: 15px 20px; background: #111; border-bottom: 4px solid #333; align-items: center; }
.timer-display { font-family: 'Share Tech Mono', monospace; font-size: 3rem; color: var(--red); text-shadow: 0 0 10px rgba(255,0,0,0.8); }
.strikes-display { font-size: 2rem; letter-spacing: 5px; }
.strike { color: #333; }
.strike.active { color: var(--red); text-shadow: 0 0 10px red; }

.bomb-module { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--metal); margin: 20px; border-radius: 15px; border: 5px solid #444; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5); position: relative; }
.module-title { position: absolute; top: 10px; left: 15px; font-family: 'Share Tech Mono'; font-size: 0.9rem; color: #888; text-transform: uppercase; }
.clue-badge { position: absolute; top: 10px; right: 15px; background: #000; padding: 5px 10px; border-radius: 5px; font-family: 'Share Tech Mono'; color: var(--yellow); border: 1px solid #555; display:flex; gap: 5px; align-items: center;}
.led { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

/* Keypad (Fase 1) */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 250px; margin-top: 20px; }
.key-btn { background: #1a1a1a; border: 2px solid #555; color: white; padding: 20px 0; font-size: 1.8rem; border-radius: 10px; text-align: center; box-shadow: 0 4px 0 #000; }
.key-btn:active { transform: translateY(4px); box-shadow: none; }
.display-screen { width: 100%; max-width: 250px; background: #0a0a0a; border: 3px solid #222; color: var(--green); font-family: 'Share Tech Mono'; font-size: 2.5rem; text-align: right; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; height: 65px; letter-spacing: 5px; }

/* Switches (Fase 2) */
.switch-container { display: flex; gap: 20px; margin-top: 20px; }
.switch-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.switch { width: 60px; height: 100px; background: #111; border-radius: 30px; position: relative; border: 3px solid #444; cursor: pointer; transition: 0.3s; box-shadow: inset 0 0 10px #000; }
.switch-knob { width: 50px; height: 50px; background: #666; border-radius: 25px; position: absolute; top: 2px; left: 2px; transition: 0.2s; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
.switch.up .switch-knob { top: 2px; background: #888; }
.switch.down .switch-knob { top: 42px; background: #444; }
.submit-btn { margin-top: 30px; background: var(--yellow); color: #000; box-shadow: 0 5px 0 #b38f00; max-width: 200px; }

/* Wires (Fase 3) */
.wires-container { display: flex; flex-direction: column; gap: 15px; width: 100%; padding: 20px; }
.wire { height: 25px; width: 100%; border-radius: 12px; cursor: pointer; position: relative; box-shadow: inset 0 5px 10px rgba(255,255,255,0.2), inset 0 -5px 10px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.5); }
.wire::before, .wire::after { content: ''; position: absolute; top: -5px; width: 15px; height: 35px; background: #111; border: 2px solid #333; }
.wire::before { left: -10px; border-radius: 5px 0 0 5px; }
.wire::after { right: -10px; border-radius: 0 5px 5px 0; }
.wire.cut { opacity: 0.3; pointer-events: none; }
.wire.cut::part { background: transparent; }

/* =========================================================
   TELA DO INSTRUTOR (THEME TERMINAL)
========================================================= */
.theme-terminal { background: var(--terminal-bg); color: var(--terminal-green); font-family: 'Share Tech Mono', monospace; }
/* Efeito de Scanlines e CRT */
.theme-terminal::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none; }
.terminal-header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 2px solid var(--terminal-green); z-index: 3; position: relative; background: #020802; }
.terminal-timer { font-size: 2.5rem; text-shadow: 0 0 8px var(--terminal-green); }
.manual-content { padding: 20px; overflow-y: auto; z-index: 3; position: relative; flex: 1; font-size: 1.1rem; line-height: 1.6; }
.manual-content h2 { border-bottom: 1px dashed var(--terminal-green); padding-bottom: 5px; margin-top: 30px; text-transform: uppercase; }
.manual-content ul { padding-left: 20px; }
.manual-content li { margin-bottom: 10px; }
.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

/* =========================================================
   EFEITOS E ESTADOS GERAIS
========================================================= */
.panic { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; border: 5px solid red; box-shadow: inset 0 0 50px red; }
@keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

#screen-end { background: #000; justify-content: center; align-items: center; text-align: center; z-index: 100; }
#end-msg { font-family: 'Teko'; font-size: 6rem; text-transform: uppercase; line-height: 1; margin-bottom: 20px; }
.win { color: var(--green); text-shadow: 0 0 30px var(--green); }
.lose { color: var(--red); text-shadow: 0 0 30px var(--red); }
</style>
</head>
<body>

<!-- TELA LOBBY -->
<div id="screen-lobby" class="screen active">
    <div class="container">

        <div style="background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px;">

<script>
/* =========================================================
   CONFIGURAÇÃO DOS NÍVEIS
========================================================= */
const LEVELS = {
    1: { time: 180, name: 'Fácil' },
    2: { time: 150, name: 'Médio' },
    3: { time: 120, name: 'Difícil' },
    4: { time: 90, name: 'Impossível' }
};

const COLORS = { R: 'var(--red)', G: 'var(--green)', B: 'var(--blue)', Y: 'var(--yellow)', W: '#ffffff', K: '#222' };

/* ESTADO LOCAL */
let roomCode = null;
let roomData = null;
let myRole = null; // 'defuser' ou 'manual'
let timerInterval = null;
let currentInput = ""; // Para o cofre

/* =========================================================
   GERAÇÃO DE LÓGICA DO PUZZLE (Só o Defuser cria)
========================================================= */
function generatePuzzleVars(level) {
    const vars = {};
    const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
    
    if (level == 1) {
        vars.bat = rnd([1, 2, 3]);
        vars.wireColorToCut = 'B'; // Fixo no nivel 1
    } 
    else if (level == 2) {
        vars.led = rnd(['R', 'B']);
        vars.wireColors = [rnd(['R','Y']), rnd(['R','Y']), 'B', rnd(['R','Y'])];
    }
    else if (level == 3) {
        vars.serial = rnd(['X7B', 'A99']);
        vars.word = rnd(['PERIGO', 'FOGO']);
        vars.wires = ['R','B','G','Y','W'].sort(()=>Math.random()-0.5);
    }
    else if (level == 4) {
        vars.code = rnd(['6666', '0000', '1234']);
        vars.wires = ['K','K','K','K','K','K']; // Todos pretos
        vars.targetWire = rnd([1, 3, 5]); // Fio correto (index 0-5)
    }
    return vars;
}

/* =========================================================
   FIREBASE ROOM MANAGEMENT
========================================================= */
function genCode() { return Math.random().toString(36).substring(2, 6).toUpperCase(); }
async function waitForFirebase() {
    return new Promise(res => { if (window.__fb) res(); else window.addEventListener('firebase-ready', res); });
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

async function createRoom() {
    await waitForFirebase();
    const lvl = parseInt(document.getElementById('select-level').value);
    roomCode = genCode();
    myRole = 'defuser';
    
    const rData = {
        code: roomCode,
        status: 'waiting',
        level: lvl,
        strikes: 0,
        phase: 1,
        expiresAt: 0, // Setado quando o instrutor entrar
        vars: generatePuzzleVars(lvl)
    };
    
    await window.__fb.set(window.__fb.ref(window.__fb.db, 'rooms/' + roomCode), rData);
    document.getElementById('display-code').innerText = roomCode;
    showScreen('screen-waiting');
    startListening();
}

async function joinRoom() {
    await waitForFirebase();
    const code = document.getElementById('input-code').value.toUpperCase();
    if(code.length !== 4) return alert("Código inválido.");
    
    const snap = await window.__fb.get(window.__fb.ref(window.__fb.db, 'rooms/' + code));
    if (snap.exists()) {
        const data = snap.val();
        if (data.status === 'waiting') {
            roomCode = code;
            myRole = 'manual';
            // Start game!
            const expiresAt = Date.now() + (LEVELS[data.level].time * 1000);
            await window.__fb.set(window.__fb.ref(window.__fb.db, 'rooms/' + code + '/status'), 'playing');
            await window.__fb.set(window.__fb.ref(window.__fb.db, 'rooms/' + code + '/expiresAt'), expiresAt);
            startListening();
        } else { alert("Sala em andamento ou fechada."); }
    } else { alert("Sala não encontrada."); }
}

function startListening() {
    window.__fb.onValue(window.__fb.ref(window.__fb.db, 'rooms/' + roomCode), snap => {
        if (!snap.exists()) return;
        const oldPhase = roomData ? roomData.phase : 1;
        roomData = snap.val();
        
        if (roomData.status === 'playing') {
            if (myRole === 'defuser') {
                showScreen('screen-bomb');
                renderBombScreen();
            } else {
                showScreen('screen-manual');
                renderManualScreen();
            }
            if(!timerInterval) timerInterval = setInterval(updateTimer, 100);
            
            // Toca efeito se errou
            if (roomData.strikes > 0) {
                document.getElementById('strike-' + roomData.strikes).classList.add('active');
                if(myRole === 'defuser') {
                    document.body.classList.add('panic');
                    setTimeout(()=>document.body.classList.remove('panic'), 500);
                }
            }
            
            // Limpa input se mudou de fase
            if(roomData.phase > oldPhase) {
                currentInput = "";
                if(document.getElementById('safe-display')) document.getElementById('safe-display').innerText = "";
            }
        }
        else if (roomData.status === 'exploded') endGame(false);
        else if (roomData.status === 'defused') endGame(true);
    });
}

function sendAction(actionObj) {
    // Usado pelo Defuser para atualizar fase ou strikes
    window.__fb.set(window.__fb.ref(window.__fb.db, 'rooms/' + roomCode), { ...roomData, ...actionObj });
}

/* =========================================================
   TIMER & GAME OVER
========================================================= */
function updateTimer() {
    if(!roomData || roomData.status !== 'playing') return;
    const left = Math.max(0, roomData.expiresAt - Date.now());
    
    if (left === 0) {
        clearInterval(timerInterval);
        if (myRole === 'defuser') sendAction({ status: 'exploded', reason: 'Tempo esgotado!' });
        return;
    }
    
    const mins = Math.floor(left / 60000);
    const secs = Math.floor((left % 60000) / 1000);
    const ms = Math.floor((left % 1000) / 10);
    
    const text = (mins>0) ? 
        `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}` : 
        `${secs.toString().padStart(2,'0')}:${ms.toString().padStart(2,'0')}`;
        
    if(myRole === 'defuser') {
        const el = document.getElementById('bomb-timer');
        el.innerText = text;
        if(left < 30000) el.style.animation = "blinker 0.5s linear infinite";
    } else {
        const el = document.getElementById('manual-timer');
        el.innerText = text;
        if(left < 30000) el.style.color = "var(--red)";
    }
}

function endGame(win) {
    clearInterval(timerInterval);
    showScreen('screen-end');
    const msg = document.getElementById('end-msg');
    msg.innerText = win ? 'BOMBA DESARMADA!' : 'BOOM!';
    msg.className = win ? 'win' : 'lose';
    document.getElementById('end-sub').innerText = win ? 'Missão Cumprida.' : (roomData.reason || 'Sua comunicação falhou.');
}

function addStrike() {
    const newStrikes = roomData.strikes + 1;
    if (newStrikes >= 3) sendAction({ strikes: 3, status: 'exploded', reason: 'Erros demais!' });
    else sendAction({ strikes: newStrikes });
}

/* =========================================================
   LÓGICA DOS PUZZLES (DEFUSER)
========================================================= */
function renderBombScreen() {
    // Esconde todos
    [1,2,3].forEach(i => document.getElementById('module-'+i).style.display = 'none');
    
    const m = document.getElementById('module-' + roomData.phase);
    m.style.display = 'flex';
    const v = roomData.vars;

    if (roomData.phase === 1) { // COFRE
        const badge = document.getElementById('clue-safe');
        if(roomData.level == 1) badge.innerHTML = `🔋 x${v.bat}`;
        else if(roomData.level == 2) badge.innerHTML = `LED <div class="led" style="background:${COLORS[v.led]}"></div>`;
        else if(roomData.level == 3) badge.innerHTML = `SN: ${v.serial}`;
        else if(roomData.level == 4) badge.innerHTML = `<span class="blink">ERRO SYS</span>`;
        
        const pad = document.getElementById('safe-keypad');
        if(pad.innerHTML.trim() === "") {
            let keys = [1,2,3,4,5,6,7,8,9,'C',0,'OK'];
            if(roomData.level == 2) keys = ['Ω','Ѱ','Δ','Σ','Φ','Λ','Θ','Ξ','Π','C','Ж','OK'];
            
            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.innerText = k;
                btn.onclick = () => handleSafeClick(k);
                pad.appendChild(btn);
            });
        }
    }
    else if (roomData.phase === 2) { // MALETA
        const badge = document.getElementById('clue-briefcase');
        if(roomData.level == 1) badge.innerHTML = 'ENGRENAGENS';
        else if(roomData.level == 2) badge.innerHTML = 'RGB_SYS';
        else if(roomData.level == 3) badge.innerHTML = `V_TXT: ${v.word}`;
        else if(roomData.level == 4) badge.innerHTML = 'MASTER_LOCK';
        
        const sw = document.getElementById('briefcase-switches');
        if(sw.innerHTML.trim() === "") {
            const numSwitches = (roomData.level == 1 || roomData.level == 4) ? 3 : 4;
            for(let i=0; i<numSwitches; i++) {
                const w = document.createElement('div');
                w.className = 'switch down';
                w.dataset.pos = '0'; // 0 = down, 1 = up
                w.innerHTML = '<div class="switch-knob"></div>';
                w.onclick = () => {
                    w.classList.toggle('up'); w.classList.toggle('down');
                    w.dataset.pos = w.classList.contains('up') ? '1' : '0';
                };
                sw.appendChild(w);
            }
        }
    }
    else if (roomData.phase === 3) { // FIOS
        const badge = document.getElementById('clue-wires');
        badge.innerHTML = 'CUIDADO!';
        
        const wc = document.getElementById('bomb-wires');
        if(wc.innerHTML.trim() === "") {
            let wires = [];
            if(roomData.level == 1) wires = ['R','B','G'];
            else if(roomData.level == 2) wires = v.wireColors;
            else if(roomData.level == 3) wires = v.wires;
            else if(roomData.level == 4) wires = v.wires;

            wires.forEach((c, idx) => {
                const w = document.createElement('div');
                w.className = 'wire';
                w.style.background = COLORS[c];
                w.onclick = () => handleWireCut(w, idx, c);
                wc.appendChild(w);
            });
        }
    }
}

// Interações do Defuser
function handleSafeClick(k) {
    const disp = document.getElementById('safe-display');
    if (k === 'C') { currentInput = ""; disp.innerText = ""; return; }
    if (k === 'OK') {
        let correct = "";
        const v = roomData.vars;
        if(roomData.level == 1) correct = v.bat==1 ? '123' : (v.bat==2 ? '456' : '789');
        else if(roomData.level == 2) correct = v.led=='R' ? 'ΩΔΦ' : 'ΣѰΩ';
        else if(roomData.level == 3) correct = v.serial=='X7B' ? '382' : '514';
        else if(roomData.level == 4) correct = v.code; // '6666' etc
        
        if (currentInput === correct) sendAction({ phase: 2 });
        else { addStrike(); currentInput = ""; disp.innerText = "ERR"; setTimeout(()=>disp.innerText="", 1000); }
        return;
    }
    if (currentInput.length < 5) {
        currentInput += k;
        disp.innerText = currentInput;
    }
}

function checkBriefcase() {
    const sws = document.querySelectorAll('.switch');
    let state = Array.from(sws).map(s => s.dataset.pos).join('');
    let correct = "";
    const v = roomData.vars;
    
    if(roomData.level == 1) correct = "101"; // Up, Down, Up
    else if(roomData.level == 2) correct = v.led=='R' ? "1100" : "0011";
    else if(roomData.level == 3) correct = v.word=='PERIGO' ? "1001" : "0110";
    else if(roomData.level == 4) correct = "111"; // Tudo cima
    
    if (state === correct) sendAction({ phase: 3 });
    else addStrike();
}

function handleWireCut(el, idx, color) {
    if(el.classList.contains('cut')) return;
    el.classList.add('cut');
    
    let isCorrect = false;
    const v = roomData.vars;
    
    if(roomData.level == 1) isCorrect = (color === 'B');
    else if(roomData.level == 2) {
        const numYellow = v.wireColors.filter(c=>c==='Y').length;
        if(numYellow > 1 && idx === v.wireColors.indexOf('Y')) isCorrect = true;
        else if(numYellow <= 1 && color === 'B') isCorrect = true;
    }
    else if(roomData.level == 3) {
        if(v.serial === 'A99' && idx === 4) isCorrect = true;
        else if(v.serial !== 'A99' && idx === 2) isCorrect = true;
    }
    else if(roomData.level == 4) isCorrect = (idx === v.targetWire);
    
    if (isCorrect) sendAction({ status: 'defused' });
    else addStrike();
}
